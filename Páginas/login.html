<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectWorkWork-Login</title>
    <link rel="stylesheet" href="../ConectionWoks/CSS/style.css">
</head>
<body class="login-page">

    <header>
    <div class="header-container">
        <a href="#" class="logo">
            <img src="../Kaue/Logo.jpg" alt="Logo" class="logo-img">
            ConnectionWorks-Login
        </a>
    </div>
</header>
<div class="login-card">
    <h2 class="card-title-lg">Bem-vindo de volta!</h2>
    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-quartenary">Entrar</button>
        <p class="signup-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </form>
</div>
</body>
</html>
