<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectionWorks - Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div class="background-shapes"></div>

    <header>
        <a href="itaworks.html" class="logo">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z">
                </path>
            </svg>
            ConnectionWorks
        </a>
    </header>

    <main>
        <section class="cadastro-section">
            <h2>ConnectionWorks</h2>
            <div class="Card-Cadastro">
                <form id="profileForm">
                    <p>De que tipo de conta você precisa?</p>

                    <div class="radio-group">
                        <div class="option-container">
                            <label class="option">
                                <input type="radio" name="accountType" value="freelancer" required>
                                <img rel="icon"
                                    src="../ConectionWoks/Imagens/task_01k9yn4fn1erfam8x8myvb0rjt_1763039211_img_0.webp"
                                    width="40px"></img>
                                <span class="titulo">Candidato</span>

                                <span class="subtitulo">Estou em busca de vagas</span>
                            </label>
                        </div>
                        <div class="option-container-2">
                            <label class="option">
                                <input type="radio" name="accountType" value="empresa" required>
                                <img rel="icon"
                                    src="../ConectionWoks/Imagens/task_01k9ymtqh6fq0agpqy8pmh4mza_1763038908_img_0.webp"
                                    width="40px"></img>
                                <span class="titulo">Empresa</span>
                                <span class="subtitulo2">Estou em busca de candidatos</span>
                            </label>
                        </div>
                    </div>
                    <button class="btn-quartenary" type="submit">Continuar</button>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
