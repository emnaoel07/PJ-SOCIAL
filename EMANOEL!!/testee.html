<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ConnectWork — Login / Cadastro</title>
  <style>
    :root{
      --green-1:#1f4e2f; /* escuro */
      --green-2:#3b6f4f; /* medio */
      --green-3:#e9f0ea; /* claro */
      --card-bg:#ffffff;
      --muted:#7a7a7a;
      --radius:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{
      margin:0;
      font-family: Inter, Roboto, Arial, sans-serif;
      background: #ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#153b2a;
    }

    /* Fundo com círculos no canto inferior esquerdo (igual à imagem) */
    .bg-circles{
      position:fixed;
      left:-75px;
      bottom:-200px;
      z-index:0;
      pointer-events:none;
    }
    .bg-circles .big{width:260px;height:250px;border-radius:50%;background:var(--green-2);display:block;box-shadow:inset -8px -6px 0 rgba(0,0,0,0.03)}
    .bg-circles .mid{width:180px;height:180px;border-radius:50%;background:var(--green-1);position:relative;left:150px;bottom:150px}

    /* Card central */
    .container{
      position:relative;
      z-index:1;
      width:420px;
      max-width:92vw;
      text-align:center;
    }
    .brand{font-weight:700;font-size:20px;color:var(--green-1);margin-bottom:18px}

    .logo{
        height: 70px;
    }
    .card{
      background:var(--card-bg);
      border-radius:14px;
      padding:18px;
      box-shadow:0 2px 0 rgba(0,0,0,0.04);
      border:1px solid rgba(31,78,47,0.08);
      text-align:left;
    }

    .step{padding:6px 2px}
    .question{color:#2e6a47;font-size:13px;margin-bottom:10px}

    /* radio-like choices (login / cadastro + empresa/usuario) */
    .choices{display:flex;flex-direction:column;gap:10px}
    .choice{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;border:1px solid rgba(31,78,47,0.06);background:linear-gradient(180deg, rgba(233,240,234,0.6), rgba(255,255,255,0.3));}
    .choice img{width:36px;height:36px;border-radius:6px;object-fit:cover}
    .choice .meta{font-size:13px}
    .choice .meta small{display:block;color:var(--muted);font-size:12px}

    .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--green-2);display:inline-block;margin-left:auto}
    .choice.selected{outline:2px solid rgba(31,78,47,0.06);background:#fbfffb}
    .choice.selected .radio{background:var(--green-1)}

    .actions{display:flex;gap:10px;align-items:center;margin-top:14px}
    .btn{background:var(--green-1);color:#fff;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;flex:1}
    .btn.ghost{background:transparent;color:var(--green-1);border:1px solid rgba(31,78,47,0.12);flex:0}

    /* Forms */
    .fields{display:flex;flex-direction:column;gap:10px}
    label{font-size:12px;color:var(--muted)}
    input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);font-size:14px}
    textarea{min-height:80px}
    .row{display:flex;gap:8px}
    .col{flex:1}

    .steps-indicator{display:flex;gap:8px;justify-content:center;margin-top:12px}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(31,78,47,0.12)}
    .dot.active{background:var(--green-1)}

    .optional{font-size:12px;color:var(--muted)}
    .summary{font-size:13px;color:#2f4f3a}

    @media (max-width:480px){.container{width:92vw}}
      /* Responsividade */
    @media (max-width: 768px) {
        .container {
            width: 90% !important;
            padding: 20px !important;
        }
        .logo{
            width: 90 !important;
        }
        .option-box {
            flex-direction: column !important;
            text-align: center !important;
        }
        .option-box img {
            margin-bottom: 8px !important;
        }
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 20px !important;
        }
        .btn {
            font-size: 14px !important;
            padding: 10px !important;
        }
        input, select {
            font-size: 14px !important;
        }
    }
</style>
</head>
<body>
  <div class="bg-circles" aria-hidden>
    <div class="big"></div>
    <div class="mid"></div>
  </div>

  <div class="container">
    <img src="Logo.jpg" alt="" class="logo">
    <div class="brand">ConnectWork</div>

    <div class="card" id="card">
      <!-- passo 0: escolha entre Login e Cadastro -->
      <div class="step" data-step="0">
        <div class="question">De que tipo de conta você precisa?</div>
        <div class="choices">
          <div class="choice selectable" data-action="candidate">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:36px;height:36px;border-radius:6px;background:linear-gradient(180deg,var(--green-3),#fff);display:flex;align-items:center;justify-content:center;color:var(--green-1);font-weight:700">C</div>
              <div class="meta">Candidato <small>Estou em busca de vagas</small></div>
            </div>
            <div class="radio"></div>
          </div>

          <div class="choice selectable" data-action="company">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:36px;height:36px;border-radius:6px;background:linear-gradient(180deg,var(--green-2),#2f5f41);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">E</div>
              <div class="meta">Empresa <small>Estou em busca de candidatos</small></div>
            </div>
            <div class="radio"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btnClear">Login</button>
          <button class="btn" id="btnNext0">Continuar</button>
        </div>
      </div>

      <!-- passo 1: login ou cadastro - aqui simplificamos: se escolher "Já tem conta" abrimos login modal simples -->
      <div class="step" data-step="login" style="display:none">
        <div class="question">Login</div>
        <div class="fields">
          <label>E‑mail</label>
          <input type="email" id="login_email" placeholder="seu@exemplo.com" />
          <label>Senha</label>
          <input type="password" id="login_password" placeholder="Senha" />
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep(0)">Voltar</button>
          <button class="btn" onclick="finishLogin()">Entrar</button>
        </div>
      </div>

      <!-- passo 2: se signup - escolha entre usuário e empresa (but initial step already did that) -->
      <!-- passo user-basic -->
      <div class="step" data-step="user-basic" style="display:none">
        <div class="question">Dados pessoais</div>
        <div class="fields">
          <label>Nome completo</label>
          <input type="text" id="user_name" placeholder="Digite seu nome completo" />

          <label>E‑mail</label>
          <input type="email" id="user_email" placeholder="seu@exemplo.com" />

          <div class="row">
            <div class="col">
              <label>Senha</label>
              <input type="password" id="user_password" placeholder="Senha" />
            </div>
            <div class="col">
              <label>CPF</label>
              <input type="text" id="user_cpf" placeholder="000.000.000-00" />
            </div>
          </div>

          <label>Data de nascimento</label>
          <input type="date" id="user_dob" />
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep(0)">Voltar</button>
          <button class="btn" id="btnNextUserBasic">Continuar</button>
        </div>
      </div>

      <!-- passo company-basic -->
      <div class="step" data-step="company-basic" style="display:none">
        <div class="question">Cadastro da empresa</div>
        <div class="fields">
          <label>Nome da empresa</label>
          <input type="text" id="company_name" placeholder="Nome da empresa" />

          <label>E‑mail corporativo</label>
          <input type="email" id="company_email" placeholder="contato@empresa.com" />

          <div class="row">
            <div class="col">
              <label>Senha</label>
              <input type="password" id="company_password" placeholder="Senha" />
            </div>
            <div class="col">
              <label>CNPJ</label>
              <input type="text" id="company_cnpj" placeholder="00.000.000/0000-00" />
            </div>
          </div>

          <label>Ano de fundação</label>
          <input type="text" id="company_year" placeholder="ex: 2008" />
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep(0)">Voltar</button>
          <button class="btn" id="btnNextCompanyBasic">Continuar</button>
        </div>
      </div>

      <!-- passo address (shared) -->
      <div class="step" data-step="address" style="display:none">
        <div class="question">Endereço <span class="optional">(opcional)</span></div>
        <div class="fields">
          <label>Cidade</label>
          <input type="text" id="addr_city" placeholder="Cidade" />

          <label>Estado</label>
          <input type="text" id="addr_state" placeholder="Estado" />

          <label>CEP</label>
          <input type="text" id="addr_zip" placeholder="00000-000" />

          <div id="company_offices" style="display:none;margin-top:6px">
            <label><input type="checkbox" id="company_has_offices" /> Possui outros escritórios?</label>
          </div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btnBackFromAddress">Voltar</button>
          <button class="btn" id="btnNextAddress">Continuar</button>
        </div>
      </div>

      <!-- passo user-edu -->
      <div class="step" data-step="user-edu" style="display:none">
        <div class="question">Formação e área</div>
        <div class="fields">
          <label>Formação escolar</label>
          <select id="user_education">
            <option value="">Selecione</option>
            <option>Ensino médio</option>
            <option>Técnico</option>
            <option>Graduação</option>
            <option>Pós-graduação</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>

          <label>Área</label>
          <select id="user_area">
            <option value="">Selecione</option>
            <option>TI</option>
            <option>Mídias</option>
            <option>Engenharia</option>
            <option>Vendas</option>
            <option>Marketing</option>
            <option>RH</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep('address')">Voltar</button>
          <button class="btn" id="btnFinishUser">Finalizar cadastro</button>
        </div>
      </div>

      <!-- passo company-info -->
      <div class="step" data-step="company-info" style="display:none">
        <div class="question">Informações da empresa</div>
        <div class="fields">
          <label>Método preferido de seleção</label>
          <select id="company_hiring_method">
            <option value="">Selecione</option>
            <option>Triagem por currículo</option>
            <option>Entrevista técnica</option>
            <option>Teste online</option>
            <option>Recrutamento interno</option>
          </select>

          <label>Tipos de vagas</label>
          <input type="text" id="company_job_types" placeholder="ex: Estágio, Junior, Pleno, Sênior" />

          <label>Benefícios</label>
          <input type="text" id="company_benefits" placeholder="ex: Vale refeição, Plano de saúde" />
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep('address')">Voltar</button>
          <button class="btn" id="btnNextCompanyInfo">Continuar</button>
        </div>
      </div>

      <!-- passo company-final -->
      <div class="step" data-step="company-final" style="display:none">
        <div class="question">Sobre a empresa</div>
        <div class="fields">
          <label>Descrição da empresa</label>
          <textarea id="company_description" placeholder="Breve descrição"></textarea>

          <label>Missão e valores</label>
          <textarea id="company_mission" placeholder="Missão, visão, valores"></textarea>

          <label>Redes sociais (se tiver)</label>
          <input type="text" id="company_socials" placeholder="LinkedIn / Instagram / Facebook" />
        </div>
        <div class="actions">
          <button class="btn ghost" onclick="goStep('company-info')">Voltar</button>
          <button class="btn" id="btnFinishCompany">Finalizar cadastro</button>
        </div>
      </div>

      <!-- passo success -->
      <div class="step" data-step="success" style="display:none">
        <div class="question">Pronto!</div>
        <div class="summary" id="summary"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn ghost" onclick="resetAll()">Voltar ao início</button>
          <button class="btn" onclick="resetAll()">Ir para Pagina</button>
        </div>
      </div>

      <div class="steps-indicator" id="dots"></div>
    </div>
  </div>

  <script>
    // fluxo simples de passos
    const steps = Array.from(document.querySelectorAll('.step'));
    const dotsContainer = document.getElementById('dots');
    let current = '0';
    const state = {accountType:null,role:null};

    function init(){
      // event listeners
      document.querySelectorAll('.choice.selectable').forEach(el=>{
        el.addEventListener('click', ()=>{
          document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
          el.classList.add('selected');
          state.role = el.getAttribute('data-action');
        })
      });

      document.getElementById('btnNext0').addEventListener('click', ()=>{
        if(!state.role){ alert('Selecione uma opção para continuar.'); return; }
        // se role = candidate -> mostrar user-basic; se company -> company-basic
        if(state.role === 'candidate'){ goStep('user-basic'); }
        else if(state.role === 'company'){ goStep('company-basic'); }
      });

      document.getElementById('btnClear').addEventListener('click', ()=>{
        document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
        state.role = null;
      });

      document.getElementById('btnNextUserBasic').addEventListener('click', ()=>{
        // simples validação mínima
        const email = document.getElementById('user_email').value.trim();
        if(!email){ alert('Informe um e-mail.'); return; }
        document.getElementById('company_offices').style.display = 'none';
        goStep('address');
        // lembrar de qual fluxo
        state.accountType = 'user';
        document.getElementById('btnBackFromAddress').onclick = ()=> goStep('user-basic');
      });

      document.getElementById('btnNextCompanyBasic').addEventListener('click', ()=>{
        const email = document.getElementById('company_email').value.trim();
        if(!email){ alert('Informe um e-mail corporativo.'); return; }
        document.getElementById('company_offices').style.display = 'block';
        goStep('address');
        state.accountType = 'company';
        document.getElementById('btnBackFromAddress').onclick = ()=> goStep('company-basic');
      });

      document.getElementById('btnNextAddress').addEventListener('click', ()=>{
        if(state.accountType === 'user') goStep('user-edu');
        else if(state.accountType === 'company') goStep('company-info');
      });

      document.getElementById('btnNextCompanyInfo').addEventListener('click', ()=> goStep('company-final'));

      document.getElementById('btnFinishUser').addEventListener('click', finishUser);
      document.getElementById('btnFinishCompany').addEventListener('click', finishCompany);

      document.getElementById('btnBackFromAddress').addEventListener('click', ()=> goStep('0'));

      // show initial
      updateVisibility();
    }

    function goStep(id){ current = id; updateVisibility(); }

    function updateVisibility(){
      steps.forEach(s=> s.style.display = (s.getAttribute('data-step') === String(current)) ? '' : 'none');
      // atualizar dots baseado em fluxo simplificado
      const visibleSteps = getVisibleStepsForFlow();
      dotsContainer.innerHTML = visibleSteps.map(k=> `<div class="dot ${k===String(current)?'active':''}"></div>`).join('');
    }

    function getVisibleStepsForFlow(){
      if(current==='0') return ['0'];
      if(current==='user-basic' || state.accountType==='user') return ['0','user-basic','address','user-edu','success'];
      if(current==='company-basic' || state.accountType==='company') return ['0','company-basic','address','company-info','company-final','success'];
      return ['0'];
    }

    function finishUser(){
      const data = {
        tipo: 'Candidato',
        nome: document.getElementById('user_name').value,
        email: document.getElementById('user_email').value,
        cpf: document.getElementById('user_cpf').value,
        nascimento: document.getElementById('user_dob').value,
        cidade: document.getElementById('addr_city').value,
        estado: document.getElementById('addr_state').value,
        cep: document.getElementById('addr_zip').value,
        formacao: document.getElementById('user_education').value,
        area: document.getElementById('user_area').value
      };
      document.getElementById('summary').innerHTML = `<strong>Conta criada — ${data.tipo}</strong><br>${data.nome || ''} • ${data.email || ''}<br>${data.cidade || ''} ${data.estado || ''} ${data.cep || ''}`;
      goStep('success');
    }

    function finishCompany(){
      const data = {
        tipo: 'Empresa',
        nome: document.getElementById('company_name').value,
        email: document.getElementById('company_email').value,
        cnpj: document.getElementById('company_cnpj').value,
        ano: document.getElementById('company_year').value,
        cidade: document.getElementById('addr_city').value,
        estado: document.getElementById('addr_state').value,
        cep: document.getElementById('addr_zip').value,
        outros: document.getElementById('company_has_offices')?.checked ? 'Sim' : 'Não',
        metodo: document.getElementById('company_hiring_method').value
      };
      document.getElementById('summary').innerHTML = `<strong>Conta criada — ${data.tipo}</strong><br>${data.nome || ''} • ${data.email || ''}<br>${data.cidade || ''} ${data.estado || ''} ${data.cep || ''}`;
      goStep('success');
    }

    function finishLogin(){
      const e = document.getElementById('login_email').value;
      if(!e) return alert('Informe o e-mail');
      alert('Login simulado — em um app real aqui você chamaria a API.');
      resetAll();
    }

    function resetAll(){
      document.querySelectorAll('input').forEach(i=>{ if(i.type==='checkbox') i.checked=false; else i.value=''; });
      document.querySelectorAll('textarea').forEach(t=> t.value='');
      document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
      state.accountType = null; state.role = null; current = '0'; updateVisibility();
    }

    // inicia
    init();
  </script>
</body>
</html>
